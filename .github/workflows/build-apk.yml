name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    # Build 100% sur un runner Linux frais GitHub.
    # Aucun Android Studio ni SDK local n'est nécessaire sur le PC.
    runs-on: ubuntu-latest

    steps:
      # 1) Récupération du projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Node.js compatible Expo SDK 50
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3) Installation des dépendances npm
      - name: Install npm dependencies
        run: npm ci

      # 4) Java 17 (requis par Expo SDK 50 / RN 0.73 / AGP)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5) Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6) Platform 34 + Build Tools + NDK (ndkVersion = 25.1.8937393 dans android/build.gradle)
      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --install "ndk;25.1.8937393"

      # 7) Vérifications de l'environnement
      - name: Verify environment
        shell: bash
        run: |
          echo "=== java -version ==="
          java -version
          echo "=== javac -version ==="
          javac -version
          echo "=== node -v / npm -v ==="
          node -v
          npm -v
          echo "=== adb --version ==="
          adb --version
          echo "=== sdkmanager --version ==="
          sdkmanager --version
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"

      # 8) TypeScript
      - name: TypeScript check
        run: npx tsc --noEmit

      # 9) Expo Doctor (informatif, non bloquant)
      - name: Expo diagnostics
        run: npx expo-doctor 2>&1 || true

      # 10) Prebuild android (--clean = dossier natif vierge garanti)
      - name: Generate Android project (prebuild)
        run: npx expo prebuild --platform android --clean

      # 11) Vérifications post-prebuild
      - name: Verify native project
        shell: bash
        run: |
          test -d "android" || { echo "ERREUR : android/ absent"; exit 1; }
          test -f "android/gradlew" || { echo "ERREUR : gradlew absent"; exit 1; }
          grep -q "splashscreen_background" "android/app/src/main/res/values/colors.xml" \
            || { echo "ERREUR : splashscreen_background absent"; exit 1; }
          echo "OK : android/, gradlew, splashscreen_background présents"

      # 12) BUILD RELEASE
      #     assembleRelease embarque automatiquement le bundle JS dans l'APK
      #     (contrairement à assembleDebug qui attend Metro / localhost:8081).
      - name: Build release APK with Gradle
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # 13) Vérifier que le bundle JS est embarqué dans l'APK
      - name: Verify JS bundle was generated
        shell: bash
        run: |
          BUNDLE="android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle"
          if [ -f "$BUNDLE" ]; then
            echo "OK : JS bundle embarqué ($(wc -c < "$BUNDLE") octets)"
          else
            echo "ERREUR : JS bundle introuvable — l'APK essaiera de contacter Metro"
            find android/app/build/generated/assets -name "*.bundle" 2>/dev/null || true
            exit 1
          fi

      # 14) Vérifier que l'APK release existe
      - name: Verify release APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK" ]; then
            echo "OK : $APK"
            ls -lh "$APK"
          else
            echo "ERREUR : APK release introuvable"
            find android/app/build/outputs -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      # 15) Supprimer l'ancien APK debug s'il existe (ne pas le publier)
      - name: Cleanup debug APK
        shell: bash
        run: |
          rm -f android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true

      # 16) Publication de l'APK RELEASE comme Artifact GitHub
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitness-tracker-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
